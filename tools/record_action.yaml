identity:
  name: loopgrid_record_action
  author: loopgridio
  label:
    en_US: Record Action
description:
  human:
    en_US: Record evidence that an external action was executed. LoopGrid does not execute the action.
  llm: Record evidence about an external action that has already happened. Never use this tool to perform the action itself.
parameters:

  - name: decision_id
    type: string
    required: true
    label:
      en_US: Decision ID
    human_description:
      en_US: LoopGrid decision identifier.
    llm_description: LoopGrid decision ID returned by Record Decision.
    form: llm
  - name: tool
    type: string
    required: true
    label:
      en_US: Tool / Action
    human_description:
      en_US: Name of the external tool/action that actually executed outside LoopGrid.
    llm_description: Name of the external tool or action already executed by another system.
    form: llm
  - name: external_reference
    type: string
    required: false
    label:
      en_US: External Reference
    human_description:
      en_US: Optional external transaction/job/reference identifier.
    llm_description: External reference returned by the real action system.
    form: llm
  - name: actor_id
    type: string
    required: false
    default: external-system
    label:
      en_US: Actor ID
    human_description:
      en_US: Identifier of the system/tool that executed the action.
    llm_description: Identifier of the external system that executed the action.
    form: llm
  - name: details_json
    type: string
    required: false
    default: "{}"
    label:
      en_US: Details JSON
    human_description:
      en_US: Optional selected action evidence as JSON.
    llm_description: Optional JSON object with action evidence.
    form: llm
  - name: idempotency_key
    type: string
    required: false
    label:
      en_US: Idempotency Key
    human_description:
      en_US: Stable key to prevent duplicate evidence on retries.
    llm_description: Stable idempotency key when available.
    form: llm
extra:
  python:
    source: tools/record_action.py
